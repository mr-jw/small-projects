<!doctype html>
<html>
  <head>
    <title>Business Card</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div class="card">
      <img
        class="avatar"
        src="./images/me.jpg"
        alt="Me taking a selfie at the ZKM in Karlsruhe, Germany."
      />

      <div class="card-info">
        <h3>Joshua Walley</h3>
        <p>Front-end Developer</p>
        <h4>Sheffield, UK</h4>
      </div>
    </div>
  </body>
</html>
